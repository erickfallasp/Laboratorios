<!--
  PAGINA DE INICIO DE SESION - LOGIN
  Proposito: Autenticar usuarios y redirigir segun rol (admin/cliente)
-->

<!DOCTYPE html>
<html lang="es"> <!-- Define idioma español para SEO y accesibilidad -->

<head>
    <meta charset="UTF-8"> <!-- Soporta caracteres especiales: tildes, emojis, simbolos -->
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Hace el diseño responsive para moviles -->
    
    <title>Login - Revision Vehicular</title> <!-- Titulo de la pestaña y SEO -->
    
    <link rel="stylesheet" href="estilosProyecto.css"> <!-- Hoja de estilos principal del proyecto -->
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> <!-- Libreria para alertas y loading -->
    
    <!-- Estilos especificos para la pagina de login -->
    <style>
        /* Contenedor del formulario - Centrado y ancho optimo */
        .login-container {
            max-width: 450px;
            margin: 50px auto;
            padding: 40px;
        }
        
        /* Encabezado del formulario - Titulo centrado */
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header h1 {
            color: var(--fondo-oscuro);
            font-size: 32px;
            margin-bottom: 10px;
        }
        .login-header p {
            color: var(--texto-atenuado);
            font-size: 16px;
        }
        
        /* Grupos de formulario - Espaciado entre campos */
        .login-form .form-group {
            margin-bottom: 20px;
        }
        .login-form label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--fondo-oscuro);
        }
        
        /* Inputs de formulario - Estilo base */
        .login-form input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--borde);
            border-radius: 8px;
            font-size: 16px; /* Evita zoom automatico en iOS */
            transition: border-color 0.3s;
        }
        
        /* Estado focus - Feedback visual al seleccionar campo */
        .login-form input:focus {
            border-color: var(--color-principal);
            outline: none;
            box-shadow: 0 0 0 3px rgba(16, 207, 200, 0.1);
        }
        
        /* Boton de envio - Estilo principal (CTA) */
        .login-form button {
            width: 100%;
            padding: 14px;
            background: var(--color-principal);
            color: #05323A;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        
        /* Hover en boton - Feedback de interaccion */
        .login-form button:hover {
            background: #0dd3cd;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(16, 207, 200, 0.3);
        }
        
        /* Pie del formulario - Enlaces secundarios */
        .login-footer {
            text-align: center;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px solid var(--borde);
        }
        .login-footer p {
            margin: 10px 0;
            color: var(--texto-atenuado);
        }
        .login-footer a {
            color: var(--color-principal);
            text-decoration: none;
            font-weight: 600;
        }
        .login-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="container"> <!-- Contenedor principal que centra el contenido -->
        
        <div class="header"> <!-- Encabezado comun con logo y navegacion -->
            <div class="header-top">
                <span class="car-icon">🚗</span>
                <h1 class="main-title">Revision Tecnica Vehicular</h1>
                <span class="car-icon">🚗</span>
            </div>
            
            <!-- Menu de navegacion con login destacado -->
            <nav class="nav-menu">
                <ul class="nav-list">
                    <li class="menu-item"><a href="index.html">🏠 Inicio</a></li>
                    <li class="menu-item"><a href="login.html" class="active btn-login-nav">🔐 Login</a></li> <!-- Enlace a ESTA pagina con estilo destacado -->
                    <li class="menu-item"><a href="precios.html">💲 Tarifas</a></li>
                    <li class="menu-item"><a href="citas.html">📅 Citas</a></li>
                    <li class="menu-item"><a href="citas-agendadas.html">📋 Citas Agendadas</a></li>
                    <li class="menu-item"><a href="contactos.html">📬 Contacto</a></li>
                </ul>    
            </nav>
        </div>

        <!-- Tarjeta principal con formulario de login -->
        <div class="card login-container">
            
            <div class="login-header">
                <h1>🔐 Iniciar Sesion</h1>
                <p>Ingresa tus credenciales para continuar</p>
            </div>

            <!-- Formulario con id para que JavaScript lo controle -->
            <form id="loginForm" class="login-form">
                
                <!-- Campo de correo electronico -->
                <div class="form-group">
                    <label for="email">Correo Electronico</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        required 
                        placeholder="tu@email.com"
                        autocomplete="email">
                    <!-- type="email": valida formato automatico, autocomplete: sugiere email guardado -->
                </div>

                <!-- Campo de contrasena -->
                <div class="form-group">
                    <label for="password">Contrasena</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        required 
                        placeholder="••••••••"
                        autocomplete="current-password">
                    <!-- type="password": oculta caracteres, autocomplete: sugiere contrasena guardada -->
                </div>

                <!-- Boton de envio principal -->
                <button type="submit" class="btn-login-submit">
                    🔑 Ingresar al Sistema
                </button>
                <!-- type="submit": dispara evento submit que JavaScript controla con preventDefault -->
                
            </form>

            <!-- Pie del formulario con enlaces secundarios -->
            <div class="login-footer">
                <p>¿No tienes cuenta? <a href="registro.html">Registrate aqui</a></p>
                <p><a href="index.html">← Volver al inicio</a></p>
            </div>
        </div>
        
    </div>

    <!-- Scripts al final para mejor rendimiento -->
    
    <script type="module" src="supabase.js"></script> <!-- Configuracion de conexion a Supabase -->
    
    <script type="module" src="app-Autorizacion.js"></script> <!-- Logica de autenticacion: handleLogin, validaciones, redireccion segun rol -->
    
</body>
</html>
