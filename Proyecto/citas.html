<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citas - Revisión Vehicular</title>
    <link rel="stylesheet" href="estilosProyecto.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🚗 Revisión Vehicular 🚗</h1>
            <h2>Sistema de Citas</h2>
            
            <nav class="nav-menu">
                <ul class="nav-list">
                    <li class="menu-item"><a href="index.html">Inicio</a></li>
                    <li class="menu-item"><a href="precios.html">Tarifas</a></li>
                    <li class="menu-item"><a href="citas.html" class="active">Citas</a></li>
                    <li class="menu-item"><a href="citas-agendadas.html">Citas Agendadas</a></li>
                    <li class="menu-item"><a href="contactos.html">Contacto</a></li>
                </ul>    
            </nav>
        </div>

        <!-- Formulario de Citas -->
        <div class="card">
            <h1>📅 Registro de Cita</h1>
            
            <form id="citaForm">
                <!-- Cliente -->
                <fieldset>
                    <legend>👤 Datos del Cliente</legend>
                    
                    <div class="form-group">
                        <label for="nombre">Nombre del Propietario:</label>
                        <input type="text" id="nombre" name="nombre" required placeholder="Ingrese su nombre completo">
                    </div>

                    <div class="form-group">
                        <label for="email">Correo Electrónico:</label>
                        <input type="email" id="email" name="email" required placeholder="correo@ejemplo.com">
                    </div>

                    <div class="form-group">
                        <label for="telefono">Teléfono / Celular:</label>
                        <input type="tel" id="telefono" name="telefono" required placeholder="8888-8888">
                    </div>
                </fieldset>

                <!-- Tipo de Vehículo -->
                <fieldset>
                    <legend>🚙 Tipo de Vehículo</legend>
                    <div class="radio-group">
                        <div class="radio-item">
                            <input type="radio" id="menor35" name="tipoVehiculo" value="menor_3_5_ton" required>
                            <label for="menor35">Vehículos Menor a 3.5 Toneladas</label>
                        </div>
                        <div class="radio-item">
                            <input type="radio" id="mayor35" name="tipoVehiculo" value="mayor_3_5_ton">
                            <label for="mayor35">Vehículos Mayor a 3.5 Toneladas</label>
                        </div>
                        <div class="radio-item">
                            <input type="radio" id="motocicleta" name="tipoVehiculo" value="motocicleta">
                            <label for="motocicleta">Motocicleta</label>
                        </div>
                        <div class="radio-item">
                            <input type="radio" id="servicio_publico" name="tipoVehiculo" value="servicio_publico">
                            <label for="servicio_publico">Servicio Público</label>
                        </div>
                        <div class="radio-item">
                            <input type="radio" id="equipo_especial" name="tipoVehiculo" value="equipo_especial">
                            <label for="equipo_especial">Equipo Especial</label>
                        </div>
                        <div class="radio-item">
                            <input type="radio" id="autobus" name="tipoVehiculo" value="autobus">
                            <label for="autobus">Autobús, Busetas-Microbús</label>
                        </div>
                    </div>
                </fieldset>

                <!-- Datos del Vehículo -->
                <fieldset>
                    <legend>🔧 Datos del Vehículo</legend>
                    
                    <div class="form-group">
                        <label for="placa">Placa del Vehículo:</label>
                        <input type="text" id="placa" name="placa" required placeholder="ABC123" style="text-transform: uppercase;">
                    </div>
                    
                    <div class="form-group">
                        <label for="marca">Marca:</label>
                        <input type="text" id="marca" name="marca" required placeholder="Toyota, Honda, etc.">
                    </div>
                    
                    <div class="form-group">
                        <label for="modelo">Modelo:</label>
                        <input type="text" id="modelo" name="modelo" placeholder="Corolla, Civic, etc.">
                    </div>
                    
                    <div class="form-group">
                        <label for="anio">Año:</label>
                        <input type="number" id="anio" name="anio" placeholder="2020" min="1900" max="2026">
                    </div>
                </fieldset>

                <!-- Fecha y Hora -->
                <fieldset>
                    <legend>📆 Seleccione Fecha y Hora</legend>
                    
                    <div class="form-group">
                        <label for="fechaCita">Fecha Preferida:</label>
                        <input type="date" id="fechaCita" name="fechaCita" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="horaCita">Hora Preferida:</label>
                        <select id="horaCita" name="horaCita" required>
                            <option value="">-- Seleccione una hora --</option>
                            <option value="08:00">08:00 AM</option>
                            <option value="09:00">09:00 AM</option>
                            <option value="10:00">10:00 AM</option>
                            <option value="11:00">11:00 AM</option>
                            <option value="13:00">01:00 PM</option>
                            <option value="14:00">02:00 PM</option>
                            <option value="15:00">03:00 PM</option>
                            <option value="16:00">04:00 PM</option>
                        </select>
                        <small class="hora-info">💡 Las horas ocupadas aparecerán deshabilitadas</small>
                    </div>
                </fieldset>

                <!-- Botón -->
                <button type="submit" class="btn btn-primary" style="margin-top: 16px; width: 100%;">
                    ✅ Agendar Cita
                </button>
            </form>
        </div>
    </div>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Script con type="module" ✅ -->
    <script type="module" src="app-citas.js"></script>
</body>
</html>
