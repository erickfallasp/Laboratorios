<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisión Vehicular - Sistema de Citas</title>           <!-- Titulos -->
    <link rel="stylesheet" href="estilosProyecto.css">            <!-- Enlace al archivo CSS para estilos -->
</head> 
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🚗 Revisión Vehicular 🚗</h1>   <!-- Titulo 1r -->
            <h2>Sistema de Citas</h2>           <!-- Titulo 2do -->
            
           <!-- Menu  Inicio, Tarifas, Citas, Contacto-->
            <nav class="nav-menu">
                <ul class="nav-list">   <!-- Enlaces a los difetentes archivos .html -->
                    <li class="menu-item"><a href="index.html">Inicio</a></li>
                    <li class="menu-item"><a href="precios.html">Tarifas</a></li>
                    <li class="menu-item"><a href="citas.html">Citas</a></li>
                    <li class="menu-item"><a href="contactos.html">Contacto</a></li>
                </ul>    
            </nav>
        </div>


        <!-- Cuadro de Contenido Principal Contenido/ Recuadro 1 --> 
                <fieldset>
                    <legend>Citas</legend>
                    <div class="checkbox-group">
                        <div class="checkbox-item">
                           <h1>📅Registro de Cita</h1>

                 <!-- Cuadro de Contenido Principal Contenido/ Recuadro 1.1 Cliente --> 
                <fieldset>
                    <legend>Cilente</legend>
                    <div class="checkbox-group">
                        <div class="checkbox-item">
            <div class="form-container">
            
            <form id="citaForm">   <!-- Formulario  con los datos del cliente -->
                <!-- Nombre del Propietario -->
                <div class="form-group">
                    <label for="nombre">Nombre del Propietario:</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Ingrese su nombre completo">
                </div>

                <!-- Correo Electrónico -->
                <div class="form-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" required placeholder="correo@ejemplo.com">
                </div>

                <!-- Teléfono -->
                <div class="form-group">
                    <label for="telefono">Teléfono / Celular:</label>
                    <input type="tel" id="telefono" name="telefono" required placeholder="8888-8888">
                </div>                
                                    
    </div>
                </fieldset>
             <!-- Cuadro de Contenido Principal Contenido/ Recuadro 1.2 Tipo de Vehículo --> 
                <fieldset>
                    <legend>Tipo de Vehículo</legend>
                    <div class="radio-group">
                        <div class="radio-item">
                            <input type="radio" id="automovil" name="tipoVehiculo" value="automovil" required>
                            <label for="automovil">Vehículos Menor a 3.5 Toneladas.</label>
                        </div>
                        <div class="radio-item">
                            <input type="radio" id="camioneta" name="tipoVehiculo" value="camioneta">
                            <label for="camioneta">Vehículos Mayor a 3.5 Toneladas.</label>
                        </div>
                        <div class="radio-item">
                            <input type="radio" id="motocicleta" name="tipoVehiculo" value="motocicleta">
                            <label for="motocicleta">Motocicleta.</label>
                        </div>
                        <div class="radio-item">
                            <input type="radio" id="bus" name="tipoVehiculo" value="bus">
                            <label for="bus">Servicio Público.</label>
                        </div>
                        <div class="radio-item">
                            <input type="radio" id="camion" name="tipoVehiculo" value="camion">
                            <label for="camion">Equipo Especial.</label>
                        </div>
                        <div class="radio-item">
                            <input type="radio" id="camion" name="tipoVehiculo" value="camion">
                            <label for="camion">Autobús, Busetas-Microbús.</label>
                        </div>
                    </div>
                </fieldset>

                 <!-- Cuadro de Contenido Principal Contenido/ Recuadro 1.3 Fecha y Hora --> 
                <fieldset>
                    <legend>Datos del Vehículo</legend>
                    <div class="form-group" style="margin-bottom: 15px;">
                        <label for="placa" style="font-size: 0.95em;">Placa del Vehículo:</label>
                        <input type="text" id="placa" name="placa" required placeholder="ABC123" style="text-transform: uppercase;">
                    </div>
                    <div class="form-group" style="margin-bottom: 15px;">
                        <label for="marca" style="font-size: 0.95em;">Marca:</label>
                        <input type="text" id="marca" name="marca" required placeholder="Toyota, Honda, etc.">
                    </div>
                    <div class="form-group" style="margin-bottom: 15px;">
                        <label for="modelo" style="font-size: 0.95em;">Modelo:</label>
                        <input type="text" id="modelo" name="modelo" placeholder="Corolla, Civic, etc.">
                    </div>
                    <div class="form-group" style="margin-bottom: 15px;">
                        <label for="anio" style="font-size: 0.95em;">Año:</label>
                        <input type="text" id="anio" name="anio" placeholder="2020">
                    </div>
                </fieldset>

                 <!-- Cuadro de Contenido Principal Contenido/ Recuadro 1.4 Cliente --> 
                <fieldset>
                    <legend>Seleccione Fecha y Hora de la Cita</legend>
                    <div class="form-group" style="margin-bottom: 15px;">
                        <label for="fechaCita" style="font-size: 0.95em;">Fecha Preferida:</label>
                        <input type="date" id="fechaCita" name="fechaCita" required>
                    </div>
                    <div class="form-group" style="margin-bottom: 15px;">
                        <label for="horaCita" style="font-size: 0.95em;">Hora Preferida:</label>
                        <select id="horaCita" name="horaCita" required>
                            <option value="">Seleccione una hora...</option>
                            <option value="08:00">08:00 AM</option>
                            <option value="09:00">09:00 AM</option>
                            <option value="10:00">10:00 AM</option>
                            <option value="11:00">11:00 AM</option>
                            <option value="13:00">01:00 PM</option>
                            <option value="14:00">02:00 PM</option>
                            <option value="15:00">03:00 PM</option>
                            <option value="16:00">04:00 PM</option>
                        </select>
                    </div>
                </fieldset>
                <!-- Boton Gregistrar-->
                <button type="submit" class="btn-registrar">Agendar Cita</button>
            </form>
        </div>
    </div>


</head>
</body>
</html>
