<!--
  PAGINA DE REGISTRO DE USUARIOS
  Proposito: Permitir a nuevos usuarios crear cuenta en el sistema
-->

<!DOCTYPE html>
<html lang="es"> <!-- Define idioma español para SEO y accesibilidad -->

<head>
    <meta charset="UTF-8"> <!-- Soporta caracteres especiales: tildes, emojis, simbolos -->
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Hace el diseño responsive para moviles -->
    
    <title>Registro - Revision Vehicular</title> <!-- Titulo de la pestaña y SEO -->
    
    <link rel="stylesheet" href="estilosProyecto.css"> <!-- Hoja de estilos principal del proyecto -->
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> <!-- Libreria para alertas y loading -->
    
    <!-- Estilos especificos para la pagina de registro -->
    <style>
        /* Contenedor del formulario - Centrado y ancho optimo */
        .registro-container {
            max-width: 500px;
            margin: 50px auto;
            padding: 40px;
        }
        
        /* Encabezado del formulario - Titulo centrado */
        .registro-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .registro-header h1 {
            color: var(--color-principal);
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        /* Grupos de formulario - Espaciado entre campos */
        .registro-form .form-group {
            margin-bottom: 20px;
        }
        
        /* Inputs de formulario - Estilo base */
        .registro-form input {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--borde);
            border-radius: 8px;
            font-size: 16px; /* Evita zoom automatico en iOS */
            transition: border-color 0.3s;
        }
        
        /* Estado focus - Feedback visual al seleccionar campo */
        .registro-form input:focus {
            border-color: var(--color-principal);
            outline: none;
        }
        
        /* Boton de envio - Estilo principal (CTA) */
        .registro-form button {
            width: 100%;
            padding: 14px;
            background: var(--color-principal);
            color: #05323A;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        /* Hover en boton - Feedback de interaccion */
        .registro-form button:hover {
            background: #0dd3cd;
            transform: translateY(-2px);
        }
        
        /* Pie del formulario - Enlaces secundarios */
        .registro-footer {
            text-align: center;
            margin-top: 20px;
            color: var(--texto-atenuado);
        }
        .registro-footer a {
            color: var(--color-principal);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="container"> <!-- Contenedor principal que centra el contenido -->
        
        <div class="header"> <!-- Encabezado comun con logo y navegacion -->
            <div class="header-top">
                <span class="car-icon">🚗</span>
                <h1 class="main-title">Revision Tecnica Vehicular</h1>
                <span class="car-icon">🚗</span>
            </div>
        </div>

        <!-- Tarjeta principal con formulario de registro -->
        <div class="card registro-container">
            
            <div class="registro-header">
                <h1>📝 Crear Cuenta</h1>
                <p>Registrate para agendar tus citas</p>
            </div>

            <!-- Formulario con id para que JavaScript lo controle -->
            <form id="registroForm" class="registro-form">
                
                <!-- Campo de nombre completo -->
                <div class="form-group">
                    <label for="nombre_completo">Nombre Completo</label>
                    <input 
                        type="text" 
                        id="nombre_completo" 
                        name="nombre_completo" 
                        required 
                        placeholder="Ej: Juan Perez Garcia">
                    <!-- required: no se puede enviar vacio, placeholder: texto de ayuda -->
                </div>

                <!-- Campo de correo electronico -->
                <div class="form-group">
                    <label for="email_registro">Correo Electronico</label>
                    <input 
                        type="email" 
                        id="email_registro" 
                        name="email" 
                        required 
                        placeholder="tu@email.com"
                        autocomplete="email">
                    <!-- type="email": valida formato automatico, autocomplete: sugiere email guardado -->
                </div>

                <!-- Campo de telefono (opcional) -->
                <div class="form-group">
                    <label for="telefono_registro">Telefono</label>
                    <input 
                        type="tel" 
                        id="telefono_registro" 
                        name="telefono" 
                        placeholder="8888-8888">
                    <!-- Sin required: campo opcional para reducir friccion en el registro -->
                </div>

                <!-- Campo de contrasena -->
                <div class="form-group">
                    <label for="password_registro">Contrasena</label>
                    <input 
                        type="password" 
                        id="password_registro" 
                        name="password" 
                        required 
                        placeholder="Minimo 6 caracteres"
                        minlength="6">
                    <!-- minlength="6": valida longitud minima para seguridad basica -->
                </div>

                <!-- Campo de confirmacion de contrasena -->
                <div class="form-group">
                    <label for="password_confirm">Confirmar Contrasena</label>
                    <input 
                        type="password" 
                        id="password_confirm" 
                        name="password_confirm" 
                        required 
                        placeholder="Repite tu contrasena"
                        minlength="6">
                    <!-- JavaScript valida que coincida con el campo anterior antes de enviar -->
                </div>

                <!-- Boton de envio principal -->
                <button type="submit" class="btn-registro">
                    ✅ Crear Cuenta
                </button>
                <!-- type="submit": dispara evento submit que JavaScript controla con preventDefault -->
                
            </form>

            <!-- Pie del formulario con enlaces secundarios -->
            <div class="registro-footer">
                <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesion aqui</a></p>
                <p style="margin-top: 10px; font-size: 14px;">
                    <a href="index.html">← Volver al inicio</a>
                </p>
            </div>
        </div>
        
    </div>

       
    <script type="module" src="supabase.js"></script> <!-- Configuracion de conexion a Supabase -->
    
    <script type="module" src="app-auth.js"></script> <!-- Logica de registro: handleRegistro, validaciones, creacion de usuario y redireccion a login -->
    
</body>
</html>
