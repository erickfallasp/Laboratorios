<!--
  PANEL DE ADMINISTRADOR - DASHBOARD PRINCIPAL
  Proposito: Interfaz exclusiva para que el admin supervise y gestione todas las citas
-->

<!DOCTYPE html>
<html lang="es"> <!-- Define idioma español para SEO y accesibilidad -->

<head>
    <meta charset="UTF-8"> <!-- Soporta caracteres especiales: tildes, emojis, simbolos -->
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Hace el diseño responsive para moviles -->
    
    <title>Panel Admin - Revision Vehicular</title> <!-- Titulo de la pestaña y SEO -->
    
    <link rel="stylesheet" href="estilosProyecto.css"> <!-- Hoja de estilos principal del proyecto -->
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> <!-- Libreria para alertas bonitas -->
    
    <!-- Estilos especificos para este dashboard (grid de estadisticas, tarjetas) -->
    <style>
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: var(--fondo-oscuro);
            color: white;
            border-radius: 12px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            padding: 20px;
            border-radius: 12px;
            background: white;
            box-shadow: var(--sombra);
            text-align: center;
        }
        
        .stat-number {
            font-size: 36px;
            font-weight: 800;
            color: var(--color-principal);
        }
        
        .stat-label {
            color: var(--texto-atenuado);
            margin-top: 5px;
        }
    </style>
</head>

<body>
    <div class="container"> <!-- Contenedor principal que centra el contenido -->
        
        <div class="header"> <!-- Encabezado comun con logo y titulo -->
            <div class="header-top">
                <span class="car-icon">🚗</span>
                <h1 class="main-title">Revision Tecnica Vehicular</h1>
                <span class="car-icon">🚗</span>
            </div>
            <!-- Nota: Admin no navega entre paginas publicas, gestiona desde dashboard -->
        </div>

        <div class="dashboard-header"> <!-- Encabezado especifico del panel admin -->
            <div>
                <h1>👑 Panel de Administrador</h1>
                <p>Gestion completa del sistema</p>
            </div>
            
            <!-- Boton de cerrar sesion (llama a funcion global de app-Autorizacion.js) -->
            <button onclick="cerrarSesion()" class="boton boton-peligro">
                🚪 Salir
            </button>
        </div>

        <!-- Seccion de estadisticas (KPIs en tiempo real) -->
        <div class="stats-grid">
            
            <!-- Tarjeta 1: Total de citas -->
            <div class="stat-card">
                <div class="stat-number" id="totalCitas">0</div> <!-- JavaScript actualiza este valor -->
                <div class="stat-label">📅 Total de Citas</div>
            </div>
            
            <!-- Tarjeta 2: Total de clientes -->
            <div class="stat-card">
                <div class="stat-number" id="totalClientes">0</div>
                <div class="stat-label">👥 Total de Clientes</div>
            </div>
            
            <!-- Tarjeta 3: Citas del dia actual -->
            <div class="stat-card">
                <div class="stat-number" id="citasHoy">0</div>
                <div class="stat-label">📆 Citas Hoy</div>
            </div>
            
        </div>

        <!-- Seccion principal: Tabla con todas las citas del sistema -->
        <div class="card">
            <h2>📋 Todas las Citas Agendadas</h2>
            
            <div class="contenedor-tabla"> <!-- Permite scroll horizontal en moviles -->
                
                <table id="tablaCitasAdmin">
                    
                    <thead> <!-- Encabezados de columna -->
                        <tr>
                            <th>ID</th>
                            <th>Fecha</th>
                            <th>Hora</th>
                            <th>Cliente</th>
                            <th>Email</th>
                            <th>Telefono</th>
                            <th>Vehiculo</th>
                            <th>Placa</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    
                    <tbody id="tbodyCitasAdmin">
                        <!-- JavaScript insertara aqui las filas con las citas de Supabase -->
                        <tr><td colspan="9" style="text-align: center;">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        
    </div>

    <!-- Scripts al final para mejor rendimiento -->
    
    <script type="module" src="supabase.js"></script> <!-- Configuracion de conexion a Supabase -->
    
    <script type="module" src="app-Autorizacion.js"></script> <!-- Verifica sesion y rol de admin -->
    
    <script type="module" src="app-dashboard-admin.js"></script> <!-- Carga estadisticas y citas, maneja acciones -->
    
</body>
</html>
